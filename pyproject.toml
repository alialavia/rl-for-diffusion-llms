[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "espo"
version = "0.1.0"
description = "ESPO: ELBO-based Sequence-level Policy Optimization for diffusion LLMs (arXiv:2512.03759)"
requires-python = ">=3.10"
# Versions the test suite and the tiny-LLaDA DDP run were verified with. LLaDA / Dream
# remote modeling code does not load under transformers 5.
dependencies = [
  "torch>=2.4",
  "transformers==4.52.4",
  "peft==0.17.0",
  "datasets>=3.0,<4",
  "huggingface_hub<1.0",
  "accelerate>=1.0",
  "pyyaml",
]

[project.optional-dependencies]
math = ["math-verify"]
wandb = ["wandb"]
test = ["pytest", "hypothesis>=6.100"]

[tool.setuptools]
packages = ["espo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
