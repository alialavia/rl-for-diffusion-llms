# ESPO on sudoku with Dream-v0-Instruct-7B, 1 node x 8 GPUs.
# Global batch per optimizer step = 8 ranks x 2 prompts x G=6 = 96 completions.
model:
  model_name_or_path: Dream-org/Dream-v0-Instruct-7B
  torch_dtype: bfloat16
  use_lora: true
  lora_r: 128
  lora_alpha: 64
  lora_dropout: 0.0
  gradient_checkpointing: true   # needed on 80GB H100s (M x coupled = 4 forwards kept per backward)

espo:
  num_generations: 6
  prompts_per_rank: 2
  micro_batch_size: 3
  num_iterations: 8          # mu
  num_mc: 2                  # M
  coupled: true
  epsilon: 0.2
  beta: 0.01
  kl_estimator: k2
  baseline: loo
  scale_rewards: false
  gen_length: 256
  block_length: 256          # Dream: pure diffusion, no semi-AR blocks
  diffusion_steps: 128
  temperature: 0.9
  remasking: entropy
  generation_batch_size: 12
  max_grad_norm: 0.2
  seed: 42

optim:
  learning_rate: 3.0e-6
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.99
  warmup_ratio: 0.001

train:
  task: sudoku
  output_dir: outputs/sudoku_dream
  max_steps: 8000
  save_steps: 500
  max_prompt_length: 400
